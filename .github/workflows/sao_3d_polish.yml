name: SAO 3D scientific polish

on:
  push:
    branches: [sao-3d-polish-2026-08-09]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sao-3d-polish-2026-08-09

      - name: Patch single-file atlas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Version bump for this audited visual/runtime refinement only.
          s=s.replace('10.0.9','10.0.10')

          old="var state={lon0:25*Math.PI/180,lat0:15*Math.PI/180,zoom:.94,drag:false,px:0,py:0,raf:0};"
          new="var state={lon0:25*Math.PI/180,lat0:15*Math.PI/180,zoom:.94,drag:false,px:0,py:0,raf:0,mode:'scientific',grid:true};"
          if old not in s: raise SystemExit('state marker not found')
          s=s.replace(old,new,1)

          old="""        var shade=.72+.28*Math.max(0,xx*(-.42)+yy*.22+z*.86);\n        d[di]=Math.min(255,sd[si]*shade);d[di+1]=Math.min(255,sd[si+1]*shade);d[di+2]=Math.min(255,sd[si+2]*shade);d[di+3]=255;"""
          new="""        var shade=state.mode==='cinematic'?(.72+.28*Math.max(0,xx*(-.42)+yy*.22+z*.86)):1;\n        d[di]=Math.min(255,sd[si]*shade);d[di+1]=Math.min(255,sd[si+1]*shade);d[di+2]=Math.min(255,sd[si+2]*shade);d[di+3]=255;"""
          if old not in s: raise SystemExit('shade marker not found')
          s=s.replace(old,new,1)

          old="""    ctx.putImageData(out,0,0);\n    ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.strokeStyle='rgba(255,228,163,.72)';ctx.lineWidth=2;ctx.stroke();ctx.restore();"""
          new="""    ctx.putImageData(out,0,0);\n    if(state.grid){\n      ctx.save();\n      ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.clip();\n      function proj(lond,latd){\n        var lo=lond*Math.PI/180,la=latd*Math.PI/180,dl=lo-state.lon0;\n        var sl=Math.sin(la),cl=Math.cos(la),sd=Math.sin(dl),cd=Math.cos(dl);\n        var x=cl*sd,y=c0*sl-s0*cl*cd,zv=s0*sl+c0*cl*cd;\n        if(zv<=0)return null;\n        return{x:cx+R*x,y:cy-R*y};\n      }\n      function traceLat(latd,step,style,width){\n        ctx.beginPath();var pen=false;\n        for(var lo=-180;lo<=180;lo+=step){var q=proj(lo,latd);if(!q){pen=false;continue;}if(!pen){ctx.moveTo(q.x,q.y);pen=true;}else ctx.lineTo(q.x,q.y);}\n        ctx.strokeStyle=style;ctx.lineWidth=width;ctx.stroke();\n      }\n      function traceLon(lond,step,style,width){\n        ctx.beginPath();var pen=false;\n        for(var la=-89;la<=89;la+=step){var q=proj(lond,la);if(!q){pen=false;continue;}if(!pen){ctx.moveTo(q.x,q.y);pen=true;}else ctx.lineTo(q.x,q.y);}\n        ctx.strokeStyle=style;ctx.lineWidth=width;ctx.stroke();\n      }\n      for(var glat=-60;glat<=60;glat+=30)traceLat(glat,2,glat===0?'rgba(255,231,169,.48)':'rgba(255,255,255,.20)',glat===0?1.15:.65);\n      for(var glon=-150;glon<=180;glon+=30)traceLon(glon,2,glon===0?'rgba(255,231,169,.48)':'rgba(255,255,255,.18)',glon===0?1.15:.65);\n      ctx.restore();\n    }\n    ctx.save();ctx.beginPath();ctx.arc(cx,cy,R,0,Math.PI*2);ctx.strokeStyle='rgba(255,228,163,.82)';ctx.lineWidth=2;ctx.stroke();ctx.restore();"""
          if old not in s: raise SystemExit('globe outline marker not found')
          s=s.replace(old,new,1)

          old="""  document.getElementById('sao3dRefreshBtn').addEventListener('click',requestRender);"""
          new="""  document.getElementById('sao3dRefreshBtn').addEventListener('click',requestRender);\n  var actions=panel.querySelector('.sao3d-actions');\n  if(actions){\n    var sci=document.createElement('button'),cin=document.createElement('button'),grid=document.createElement('button');\n    sci.type=cin.type=grid.type='button';\n    sci.className='secondary active';cin.className='secondary';grid.className='secondary active';\n    sci.textContent='عرض علمي';cin.textContent='عرض سينمائي';grid.textContent='شبكة الإحداثيات';\n    function syncModeButtons(){\n      sci.classList.toggle('active',state.mode==='scientific');\n      cin.classList.toggle('active',state.mode==='cinematic');\n      grid.classList.toggle('active',state.grid);\n      sci.setAttribute('aria-pressed',state.mode==='scientific');\n      cin.setAttribute('aria-pressed',state.mode==='cinematic');\n      grid.setAttribute('aria-pressed',state.grid);\n    }\n    sci.addEventListener('click',function(){state.mode='scientific';syncModeButtons();requestRender();});\n    cin.addEventListener('click',function(){state.mode='cinematic';syncModeButtons();requestRender();});\n    grid.addEventListener('click',function(){state.grid=!state.grid;syncModeButtons();requestRender();});\n    actions.appendChild(sci);actions.appendChild(cin);actions.appendChild(grid);syncModeButtons();\n  }\n  var progressBar=document.getElementById('bar');\n  if(progressBar&&window.MutationObserver){\n    new MutationObserver(function(){\n      if((progressBar.style.width||'').trim()==='100%'&&panel.classList.contains('active')) requestRender();\n    }).observe(progressBar,{attributes:true,attributeFilter:['style']});\n  }"""
          if old not in s: raise SystemExit('refresh marker not found')
          s=s.replace(old,new,1)

          old='اسحب بالماوس لتدوير الكرة، واستخدم عجلة الماوس للتقريب. الألوان تُقرأ مباشرة من خريطة 2D العلمية الحالية ولا يعاد حساب معيار مستقل للعرض ثلاثي الأبعاد.'
          new='اسحب بالماوس لتدوير الكرة واستخدم عجلة الماوس للتقريب. الوضع العلمي هو الافتراضي ويحافظ على ألوان خريطة 2D دون تغيير السطوع، أما الوضع السينمائي فيضيف إضاءة بصرية فقط. يتم تحديث الكرة تلقائياً بعد اكتمال حساب الخريطة.'
          if old not in s: raise SystemExit('help marker not found')
          s=s.replace(old,new,1)

          # Small styling only; no scientific engine changes.
          marker='</style>\n\n</head>'
          css="""\n/* v10.0.10 3D scientific polish */\n.sao3d-actions button.active{border-color:rgba(255,225,150,.88)!important;box-shadow:0 0 0 2px rgba(226,190,105,.13),0 8px 20px rgba(0,0,0,.22)!important;color:#ffe7a2!important}\n#sao3dPanel.active{background:radial-gradient(circle at 50% 42%,rgba(40,92,145,.18),transparent 38%),linear-gradient(180deg,rgba(7,18,31,.98),rgba(3,9,17,.99))}\n.sao3d-wrap:before{content:'';position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(circle,rgba(255,255,255,.62) 0 1px,transparent 1.2px);background-size:53px 47px;opacity:.10}\n"""
          if marker not in s: raise SystemExit('style head marker not found')
          s=s.replace(marker,css+marker,1)

          p.write_text(s,encoding='utf-8')
          PY

      - name: Validate scientific invariants and JavaScript
        shell: bash
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -type f -printf '%f\n' | sort | tr '\n' ' ')" = "index.html "
          grep -q "const SAAO_DALT_TABLE" index.html
          grep -q "var state={lon0:25\*Math.PI/180,lat0:15\*Math.PI/180,zoom:.94,drag:false,px:0,py:0,raf:0,mode:'scientific',grid:true};" index.html
          grep -q "الوضع العلمي هو الافتراضي" index.html
          grep -q "10.0.10" index.html
          python - <<'PY'
          import re
          s=open('index.html',encoding='utf-8').read()
          m=re.search(r'<script id="sao3dCleanRuntime">(.*?)</script>',s,re.S)
          assert m, '3D runtime missing'
          open('/tmp/sao3d.js','w',encoding='utf-8').write(m.group(1))
          assert "state.mode==='cinematic'" in m.group(1)
          assert 'MutationObserver' in m.group(1)
          assert 'traceLat' in m.group(1) and 'traceLon' in m.group(1)
          PY
          node --check /tmp/sao3d.js

      - name: Commit polished index only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/sao_3d_polish.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git add index.html
          git commit -m "SAO v10.0.10: scientific 3D globe polish"
          git push origin HEAD:sao-3d-polish-2026-08-09

<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>خرائط عودة وSAAO لرؤية الهلال v9.6.3</title>
<style>
html,body{height:100%;margin:0;background:#06121f;color:#eef7ff;font-family:"Segoe UI",Tahoma,Arial,sans-serif}body{display:grid;place-items:center}.card{width:min(520px,calc(100% - 40px));padding:28px;border:1px solid #294a68;border-radius:18px;background:linear-gradient(145deg,#0b2035,#071522);box-shadow:0 25px 80px #0008;text-align:center}.moon{font-size:54px;color:#ffd66b}.title{font-size:20px;font-weight:800;margin:12px 0 6px}.sub{color:#9fb8cf;font-size:13px;line-height:1.7}.bar{height:8px;margin-top:20px;border-radius:999px;background:#102b44;overflow:hidden}.fill{height:100%;width:35%;border-radius:inherit;background:linear-gradient(90deg,#35d59a,#42b9ff,#b56cff);animation:load 1.2s ease-in-out infinite alternate}@keyframes load{to{transform:translateX(185%)}}.error{margin-top:14px;color:#ff9cae;white-space:pre-wrap;display:none}
</style>
</head>
<body>
<main class="card">
<div class="moon">☾</div>
<div class="title">أطلس الباز لرؤية الهلال</div>
<div class="sub">تحميل محرك معيارَي عودة ومرصد جنوب أفريقيا الفلكي SAAO…</div>
<div class="bar"><div class="fill"></div></div>
<div class="error" id="error"></div>
</main>
<script>
(async()=>{
  const parts=[
    'payload/part-001.txt','payload/part-002.txt','payload/part-003.txt','payload/part-004.txt',
    'payload/part-005.txt','payload/part-006.txt','payload/part-007.txt','payload/part-008.txt'
  ];
  try{
    if(typeof DecompressionStream!=='function') throw new Error('المتصفح لا يدعم فك ضغط الصفحة. استخدم إصدارًا حديثًا من Chrome أو Edge أو Firefox أو Safari.');
    const texts=await Promise.all(parts.map(async path=>{
      const response=await fetch(path,{cache:'no-store'});
      if(!response.ok) throw new Error(`تعذر تحميل ${path}: HTTP ${response.status}`);
      return response.text();
    }));
    const binary=atob(texts.join('').replace(/\s+/g,''));
    const bytes=Uint8Array.from(binary,c=>c.charCodeAt(0));
    const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));
    const html=await new Response(stream).text();
    document.open();
    document.write(html);
    document.close();
  }catch(error){
    const box=document.getElementById('error');
    box.style.display='block';
    box.textContent='حدث خطأ أثناء تحميل البرنامج:\n'+(error?.message||String(error));
    console.error(error);
  }
})();
</script>
</body>
</html>

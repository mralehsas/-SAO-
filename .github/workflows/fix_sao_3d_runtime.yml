name: Fix SAO v10.0.9 runtime

on:
  push:
    branches: [main]
    paths:
      - '.deploy/FIX_3D_RUNTIME'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Move 3D runtime block to the real document body
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          escaped_marker = r'<script id=\"sao3dScript\" data-sao3d=\"v10.0.9\">'
          normal_marker = '<script id="sao3dScript" data-sao3d="v10.0.9">'

          escaped_count = s.count(escaped_marker)
          normal_count = s.count(normal_marker)
          if escaped_count + normal_count != 1:
              raise SystemExit(
                  f'Expected exactly one SAO 3D script marker; escaped={escaped_count}, normal={normal_count}'
              )

          marker = escaped_marker if escaped_count == 1 else normal_marker
          start = s.index(marker)
          end_tag = '</script>'
          end = s.find(end_tag, start)
          if end < 0:
              raise SystemExit('Could not find closing script tag for SAO 3D block')
          end += len(end_tag)
          block = s[start:end]

          # Guard against accidentally capturing an unrelated/truncated block.
          for required in ('globeCanvas', 'document.readyState', 'const boot = () =>'):
              if required not in block:
                  raise SystemExit(f'3D block is missing required marker: {required}')

          # Remove the misplaced block from the report HTML template.
          s = s[:start] + s[end:]

          # The wrapper tag was escaped only because it had landed inside a JS
          # template literal. Normalize it before placing it in real HTML.
          block = block.replace(escaped_marker, normal_marker, 1)

          # Normalize the 3D style wrapper for the real document head as well.
          escaped_style = r'<style id=\"sao3dStyles\" data-sao3d=\"v10.0.9\">'
          normal_style = '<style id="sao3dStyles" data-sao3d="v10.0.9">'
          if s.count(escaped_style) == 1:
              s = s.replace(escaped_style, normal_style, 1)
          elif s.count(normal_style) != 1:
              raise SystemExit('Expected exactly one SAO 3D style block')

          # Insert before the REAL document closing body tag, not a </body>
          # sequence embedded inside a JavaScript report template literal.
          body_end = s.rfind('</body>')
          if body_end < 0:
              raise SystemExit('Final </body> not found')
          s = s[:body_end] + '\n' + block + '\n' + s[body_end:]

          # Scientific-engine invariants: preserve the detailed SAAO table
          # and its DALT/|DAZ| interpolation path exactly.
          scientific_markers = (
              'const SAAO_DALT_TABLE',
              'function saaoLimitsFromDAZ(daz)',
              '[20.0,4.53,2.63],[20.5,4.43,2.53],[21.0,4.33,2.43]',
              'const saoVisualMargin = dAltLowerLimb - lim.upper;',
              'const saoOpticalMargin = dAltLowerLimb - lim.lower;'
          )
          for required in scientific_markers:
              if required not in s:
                  raise SystemExit(f'Scientific SAAO invariant missing: {required}')

          # Base application initialization must remain intact.
          for required in ('id="mapCanvas"', 'id="dateInput"', 'setDateInputToTodayOnOpen()', 'refreshAll();'):
              if required not in s:
                  raise SystemExit(f'Base runtime invariant missing: {required}')

          if s.count(normal_marker) != 1 or s.count(escaped_marker) != 0:
              raise SystemExit('3D script marker was not normalized exactly once')
          if s.rfind(normal_marker) > s.rfind('</body>'):
              raise SystemExit('3D script was not placed inside the final body')

          # Ensure the relocated block is near the actual document end, not
          # inside an earlier report template.
          tail = s[s.rfind(normal_marker):]
          if not tail.rstrip().endswith('</body>\n</html>') and not tail.rstrip().endswith('</body></html>'):
              # Do not require exact whitespace, but require the final HTML close.
              if '</body>' not in tail or '</html>' not in tail:
                  raise SystemExit('3D block is not in the final document tail')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Validate top-level inline JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class ScriptCollector(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.in_script = False
                  self.external = False
                  self.buf = []
                  self.scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == 'script':
                      self.in_script = True
                      self.external = any(k.lower() == 'src' for k, _ in attrs)
                      self.buf = []
              def handle_data(self, data):
                  if self.in_script and not self.external:
                      self.buf.append(data)
              def handle_endtag(self, tag):
                  if tag.lower() == 'script' and self.in_script:
                      if not self.external:
                          self.scripts.append(''.join(self.buf))
                      self.in_script = False
                      self.external = False
                      self.buf = []

          html = Path('index.html').read_text(encoding='utf-8')
          parser = ScriptCollector()
          parser.feed(html)
          if len(parser.scripts) < 2:
              raise SystemExit(f'Expected multiple inline scripts; found {len(parser.scripts)}')

          out = Path('/tmp/sao_inline_scripts')
          out.mkdir(exist_ok=True)
          for i, script in enumerate(parser.scripts):
              (out / f'script_{i}.js').write_text(script, encoding='utf-8')
          print(f'Collected {len(parser.scripts)} top-level inline scripts')
          PY
          for f in /tmp/sao_inline_scripts/*.js; do
            echo "Checking $f"
            node --check "$f"
          done

      - name: Verify repaired source placement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text(encoding='utf-8')
          marker = '<script id="sao3dScript" data-sao3d="v10.0.9">'
          pos = s.index(marker)
          final_body = s.rfind('</body>')
          final_html = s.rfind('</html>')
          if not (0 < pos < final_body < final_html):
              raise SystemExit('Final DOM placement verification failed')
          if '</body></html>`;' in s[pos:final_body]:
              raise SystemExit('3D block still appears inside a report template')
          print('SAO v10.0.9 runtime placement verified')
          PY

      - name: Commit repaired runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fix_sao_3d_runtime.yml .deploy/FIX_3D_RUNTIME
          git add index.html
          git commit -m "Fix SAO v10.0.9 runtime and 3D integration"
          git push

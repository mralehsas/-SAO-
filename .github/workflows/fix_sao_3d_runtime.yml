name: Fix SAO v10.0.9 runtime

on:
  push:
    branches: [main]
    paths:
      - '.deploy/FIX_3D_RUNTIME'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Relocate misplaced 3D script
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          token = 'sao3dScript'
          idpos = s.find(token)
          if idpos < 0:
              raise SystemExit('sao3dScript token not found')
          start = s.rfind('<script', 0, idpos)
          end = s.find('</script>', idpos)
          if start < 0 or end < 0:
              raise SystemExit('3D script boundaries not found')
          end += len('</script>')

          block = s[start:end]
          s = s[:start] + s[end:]

          # Normalize wrapper quotes only; keep JS body unchanged.
          gt = block.find('>')
          if gt < 0:
              raise SystemExit('3D opening tag malformed')
          block = block[:gt+1].replace('\\"', '"') + block[gt+1:]

          # Normalize 3D style wrapper if previous deployment escaped its quotes.
          st = s.find('sao3dStyles')
          if st >= 0:
              ss = s.rfind('<style', 0, st)
              se = s.find('>', st)
              if ss >= 0 and se >= 0:
                  s = s[:ss] + s[ss:se+1].replace('\\"', '"') + s[se+1:]

          body_end = s.rfind('</body>')
          if body_end < 0:
              raise SystemExit('final body tag not found')
          s = s[:body_end] + '\n' + block + '\n' + s[body_end:]

          p.write_text(s, encoding='utf-8')
          print('3D script relocated to final document body.')
          PY

      - name: Validate browser-level inline JavaScript syntax
        shell: bash
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path

          class C(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=False)
                  self.inside=False; self.external=False; self.buf=[]; self.scripts=[]
              def handle_starttag(self, tag, attrs):
                  if tag.lower()=='script':
                      self.inside=True
                      self.external=any(k.lower()=='src' for k,_ in attrs)
                      self.buf=[]
              def handle_data(self, data):
                  if self.inside and not self.external: self.buf.append(data)
              def handle_endtag(self, tag):
                  if tag.lower()=='script' and self.inside:
                      if not self.external: self.scripts.append(''.join(self.buf))
                      self.inside=False; self.external=False; self.buf=[]

          html=Path('index.html').read_text(encoding='utf-8')
          c=C(); c.feed(html)
          out=Path('/tmp/sao_js'); out.mkdir(exist_ok=True)
          for i,js in enumerate(c.scripts):
              (out/f'{i:02d}.js').write_text(js,encoding='utf-8')
          if len(c.scripts)<2:
              raise SystemExit(f'Only {len(c.scripts)} inline script(s) detected')
          print(f'Detected {len(c.scripts)} inline scripts')
          PY
          for f in /tmp/sao_js/*.js; do
            echo "node --check $f"
            node --check "$f"
          done

      - name: Commit repaired runtime
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/fix_sao_3d_runtime.yml .deploy/FIX_3D_RUNTIME
          git add index.html
          git commit -m "Fix SAO v10.0.9 runtime and 3D integration"
          git push

name: Inject SAO 3D fallback

on:
  push:
    branches: [main]
    paths:
      - '.deploy/INJECT_SAO3D_FALLBACK'

permissions:
  contents: write

jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate fallback JavaScript
        run: node --check sao3d-fallback.js

      - name: Inject fallback loader
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="sao3d-fallback.js?v=10.0.9-fix3"></script>'
          if tag not in s:
              pos=s.rfind('</body>')
              if pos<0:
                  raise SystemExit('Final </body> not found')
              s=s[:pos]+'\n'+tag+'\n'+s[pos:]
          if 'id="mapCanvas"' not in s or 'id="mapStage"' not in s:
              raise SystemExit('Map DOM invariants missing')
          if 'const SAAO_DALT_TABLE' not in s or 'function saaoLimitsFromDAZ' not in s:
              raise SystemExit('SAAO scientific engine markers missing')
          p.write_text(s,encoding='utf-8')
          PY

      - name: Verify loader placement
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('index.html').read_text(encoding='utf-8')
          tag='<script src="sao3d-fallback.js?v=10.0.9-fix3"></script>'
          assert s.count(tag)==1
          assert s.rfind(tag) < s.rfind('</body>')
          print('SAO 3D fallback loader verified')
          PY

      - name: Commit fallback integration
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f .github/workflows/inject_sao3d_fallback.yml .deploy/INJECT_SAO3D_FALLBACK
          git add index.html sao3d-fallback.js
          git commit -m "Guarantee SAO 3D globe controls and rendering"
          git push

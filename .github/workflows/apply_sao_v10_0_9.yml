name: Apply SAO v10.0.9 3D

on:
  push:
    branches: [main]
    paths:
      - '.deploy/READY'

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Rebuild verified index.html
        shell: bash
        run: |
          set -euo pipefail
          : > index.html
          for f in .deploy/part_*.b64; do
            base64 -d "$f" | xz -d >> index.html
          done
          echo "4303422d048421efdfe7d5fa1e4c25f8070e8f3f9cf3451a5a9dfff85bf1f6f0  index.html" | sha256sum -c -
          grep -q "v10.0.9" index.html
          grep -q "globeCanvas" index.html
          grep -q "SAAO_Q_VISUAL = 11.3" index.html
          grep -q "SAAO_Q_OPTICAL = 9.0" index.html
      - name: Commit SAO 3D build
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -rf .deploy
          git add index.html .deploy
          git commit -m "Upgrade SAO atlas to v10.0.9 3D"
          git push
